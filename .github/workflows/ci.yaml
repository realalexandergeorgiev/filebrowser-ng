name: Continuous Integration

# Fork CI: main is the default branch (local filebrowser-ng tracks
# origin/main). govulncheck and the checksums job are required by TODO.md;
# cache keys carry the module path on purpose (see TODO.md P4).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
      - "filebrowser-ng"
    tags:
      - "v*"
  pull_request:

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-github.com/realalexandergeorgiev/filebrowser-ng-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: "latest"

  govulncheck:
    name: Go Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Get pnpm store directory
        working-directory: frontend
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-github.com/realalexandergeorgiev/filebrowser-ng-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Get pnpm store directory
        working-directory: frontend
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-github.com/realalexandergeorgiev/filebrowser-ng-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm audit

  release-artifacts:
    name: Release Artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test-backend, lint-backend, govulncheck, lint-frontend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::8}"
          MOD=github.com/realalexandergeorgiev/filebrowser-ng
          LDF="-s -w -X ${MOD}/version.Version=${VERSION} -X ${MOD}/version.CommitSHA=${COMMIT}"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/}; n="filebrowser-ng_${GOOS}_${GOARCH}"
            [ "$GOOS" = windows ] && n="$n.exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="$LDF" -o "dist/$n" .
          done
          (cd dist && sha256sum filebrowser-ng_* > checksums.txt && sha256sum -c checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-ng-${{ github.ref_name }}
          path: |
            dist/filebrowser-ng_*
            dist/checksums.txt

  checksums:
    name: Verify Release Checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: filebrowser-ng-${{ github.ref_name }}
          path: dist
      - working-directory: dist
        run: sha256sum -c checksums.txt