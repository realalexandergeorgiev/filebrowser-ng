version: '3'

tasks:
  build:frontend:
    desc: Build frontend assets
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run build

  build:backend:
    desc: Build backend binary
    cmds:
      - go build -trimpath -ldflags='-s -w -X "github.com/realalexandergeorgiev/filebrowser-ng/version.Version={{.VERSION}}" -X "github.com/realalexandergeorgiev/filebrowser-ng/version.CommitSHA={{.GIT_COMMIT}}"' -o filebrowser-ng .
    vars:
      GIT_COMMIT:
        sh: git log -n 1 --format=%h
      VERSION:
        sh: git describe --tags --abbrev=0 --match=v* 2>/dev/null | cut -c 2- || echo "0.0.0-ng"

  audit:go:
    desc: Go vulnerability scan (fails on known vulns)
    cmds:
      - go vet ./...
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  audit:frontend:
    desc: Frontend dependency audit
    dir: frontend
    cmds:
      - pnpm audit --audit-level=high

  audit:
    desc: All security audits (Go + frontend)
    cmds:
      - task: audit:go
      - task: audit:frontend

  test:go:
    desc: Backend tests with race detector
    cmds:
      - go test -race ./...

  build:
    desc: Build both frontend and backend
    cmds:
      - task: build:frontend
      - task: build:backend

  release:make:
    internal: true
    prompt: Do you wish to proceed?
    cmds:
      - pnpm dlx commit-and-tag-version -s

  release:dry-run:
    internal: true
    cmds:
      - pnpm dlx commit-and-tag-version --dry-run --skip

  release:
    desc: Create a new release
    cmds:
      - task: docs:cli:generate
      - git add docs/cli
      - |
        if [[ `git status docs/cli --porcelain` ]]; then
          git commit -m 'chore(docs): update CLI documentation'
        fi
      - task: release:dry-run
      - task: release:make

  docs:cli:generate:
    cmds:
      - rm -rf docs/cli
      - mkdir -p docs/cli
      - go run . docs
    generates:
      - docs/cli

